<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Lebenslauf von {{ NAME }}">
    <title>Lebenslauf</title>
    <style>
        /* ======= PAGE SETUP (A4) ======= */
        @page {
            size: A4;
            margin: {{ PAGE_MARGIN_TOP }} {{ PAGE_MARGIN_RIGHT }} {{ PAGE_MARGIN_BOTTOM }} {{ PAGE_MARGIN_LEFT }};
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: {{ FONT_FAMILY }};
            font-size: {{ FONT_SIZE_BODY }}pt;
            color: #222;
            line-height: 1.4;
            background: #fff;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* ======= HEADER (Name + Photo) ======= */
        .cv-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 3mm;
        }

        .cv-header-left {
            flex: 1;
            padding-right: 6mm;
        }

        .cv-name {
            font-size: {{ FONT_SIZE_NAME }}pt;
            font-weight: 700;
            color: {{ ACCENT_COLOR }};
            margin-bottom: 2mm;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .cv-contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8mm 5mm;
            font-size: 8.5pt;
            color: #444;
        }

        .cv-contact-item {
            display: flex;
            align-items: baseline;
            gap: 1.5mm;
        }

        .cv-contact-label {
            color: #777;
            font-size: 7.5pt;
            min-width: 16mm;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .cv-contact-value {
            color: #333;
        }

        .cv-photo-container {
            flex-shrink: 0;
        }

        .cv-photo {
            width: {{ PHOTO_WIDTH }};
            height: {{ PHOTO_HEIGHT }};
            object-fit: cover;
            border: 0.3mm solid #ddd;
        }

        /* ======= KURZPROFIL ======= */
        .cv-profile {
            font-size: 9pt;
            color: #444;
            line-height: 1.4;
            margin-bottom: 3mm;
            padding: 2mm 0;
            font-style: italic;
        }

        /* ======= DIVIDER LINE (under header) ======= */
        .cv-header-divider {
            border: none;
            border-top: 0.5mm solid {{ ACCENT_COLOR }};
            margin-bottom: 3mm;
        }

        /* ======= SECTION ======= */
        .cv-section {
            margin-bottom: 2.5mm;
        }

        .cv-section-title {
            font-size: {{ FONT_SIZE_SECTION }}pt;
            font-weight: 700;
            color: {{ ACCENT_COLOR }};
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding-bottom: 0.8mm;
            border-bottom: 0.3mm solid {{ ACCENT_COLOR }};
            margin-bottom: 1.5mm;
        }

        /* ======= TABLE ROWS (Date | Content) ======= */
        .cv-entry-table {
            width: 100%;
            border-collapse: collapse;
        }

        .cv-entry-table td {
            vertical-align: top;
            padding-bottom: 2mm;
        }

        .cv-date-col {
            width: {{ DATE_COLUMN_WIDTH }};
            font-size: 8.5pt;
            color: #555;
            padding-right: 3mm;
            padding-top: 0.2mm;
            white-space: nowrap;
        }

        .cv-detail-col {
            width: auto;
        }

        /* ======= ENTRY CONTENT ======= */
        .cv-entry-title {
            font-weight: 700;
            color: #222;
            margin-bottom: 0.3mm;
        }

        .cv-entry-subtitle {
            color: #555;
            margin-bottom: 0.8mm;
            font-size: 9.5pt;
        }

        .cv-entry-location {
            font-style: italic;
            color: #777;
            font-size: 8.5pt;
        }

        .cv-task-list {
            list-style: none;
            padding: 0;
            margin: 0.5mm 0 0 0;
        }

        .cv-task-list li {
            position: relative;
            padding-left: 3mm;
            margin-bottom: 0.3mm;
            line-height: 1.35;
            font-size: 9.5pt;
        }

        .cv-task-list li::before {
            content: "–";
            position: absolute;
            left: 0;
            color: {{ ACCENT_COLOR }};
        }

        /* ======= DETAIL LIST (for education details, etc.) ======= */
        .cv-detail-list {
            list-style: none;
            padding: 0;
            margin: 0.3mm 0 0 0;
        }

        .cv-detail-list li {
            position: relative;
            padding-left: 3mm;
            margin-bottom: 0.2mm;
            color: #555;
            font-size: 9pt;
        }

        .cv-detail-list li::before {
            content: "–";
            position: absolute;
            left: 0;
            color: {{ ACCENT_COLOR }};
        }

        /* ======= PROJECTS (compact style) ======= */
        .cv-project-name {
            font-weight: 700;
            color: #222;
        }

        .cv-project-tech {
            color: {{ ACCENT_COLOR }};
            font-size: 8.5pt;
            margin-left: 1.5mm;
        }

        .cv-project-desc {
            color: #555;
            margin-top: 0.3mm;
            font-size: 9pt;
        }

        /* ======= SKILLS ======= */
        .cv-skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1mm 0;
        }

        .cv-skill-group {
            width: 100%;
            display: flex;
            align-items: baseline;
            gap: 2mm;
            margin-bottom: 0.8mm;
        }

        .cv-skills-label {
            font-size: 9pt;
            color: #555;
            min-width: 25%;
            padding-right: 3mm;
            font-weight: 600;
        }

        .cv-skills-value {
            color: #333;
            font-size: 9.5pt;
        }

        .cv-lang-entry {
            margin-bottom: 0.3mm;
        }

        .cv-lang-name {
            display: inline;
            font-weight: 600;
        }

        .cv-lang-level {
            color: #777;
            font-size: 8.5pt;
        }

        /* ======= OTHER / SONSTIGES ======= */
        .cv-other-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .cv-other-list li {
            padding-left: 3mm;
            position: relative;
            margin-bottom: 0.2mm;
            font-size: 9.5pt;
        }

        .cv-other-list li::before {
            content: "–";
            position: absolute;
            left: 0;
            color: {{ ACCENT_COLOR }};
        }

        /* ======= SIGNATURE BLOCK ======= */
        .cv-signature {
            margin-top: 4mm;
            text-align: left;
        }

        .cv-signature-location-date {
            font-size: 9pt;
            color: #333;
            margin-bottom: 1mm;
        }

        .cv-signature-img {
            display: block;
            mix-blend-mode: multiply;
        }

        .cv-signature-name {
            font-size: 9pt;
            color: #333;
            margin-top: 1mm;
        }

        /* ======= DEBUG MODE ======= */
        {{ DEBUG_CSS }}

        /* ======= PRINT BEHAVIOR ======= */
        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <!-- ======= HEADER ======= -->
    <div class="cv-header">
        <div class="cv-header-left">
            <div class="cv-name">{{ NAME }}</div>
            <div class="cv-contact-grid">
                {{ CONTACT_BLOCK }}
            </div>
        </div>
        {{ PHOTO_BLOCK }}
    </div>

    <hr class="cv-header-divider">

    <!-- ======= KURZPROFIL ======= -->
    {{ PROFILE_BLOCK }}

    <!-- ======= DYNAMIC SECTIONS ======= -->
    {{ SECTIONS_HTML }}

    <!-- ======= SIGNATURE ======= -->
    {{ SIGNATURE_BLOCK }}
</body>
</html>
